name: Build Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure channel secrets and Neutralino runtime
        run: ./configure.sh
        env:
          YAAGL_NEU_TAG: latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check, lint, and format
        run: pnpm run precommit

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Update hosts helper from release
        run: bash scripts/update-hosts-helper-release.sh
        env:
          HELPER_RELEASE: latest

      - name: Build Sophon for arm64
        run: ./build-sophon.sh

      - name: Build arm64 release assets
        run: |
          YAAGL_VERSION="$(node -p "require('./package.json').version")" \
            bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: arm64

      - name: Verify arm64 release assets
        run: |
          test "$(find release-assets/arm64 -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 11

      - name: Upload arm64 release assets
        uses: actions/upload-artifact@v4
        with:
          name: yaaglm-arm64
          path: release-assets/arm64
