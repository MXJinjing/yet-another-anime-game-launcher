name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, such as 1.1.5. Leave empty to use package.json.
        required: false
        type: string
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_VERSION:-}"
          tag="$(printf '%s' "$tag" | tr -d '[:space:]')"
          if [ -z "$tag" ] && [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            tag="$(node -p "require('./package.json').version")"
          fi
          case "$tag" in
            *[!0-9A-Za-z._+-]*|"")
              echo "Invalid release tag: ${tag}"
              exit 1
              ;;
          esac
          sha="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "push" ]; then
            if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
              echo "origin/main is not available, cannot verify that ${tag} is on main."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
              echo "Tag ${tag} points at ${sha}, which is not merged into main."
              echo "Merge the commit into main first, then push the version tag again."
              exit 1
            fi
          fi
          if payload="$(gh api "repos/${{ github.repository }}/git/ref/tags/${tag}" 2>/dev/null)"; then
            existing="$(printf '%s' "$payload" | jq -r '.object.sha')"
            kind="$(printf '%s' "$payload" | jq -r '.object.type')"
            if [ "$kind" = "tag" ]; then
              existing="$(gh api "repos/${{ github.repository }}/git/tags/${existing}" --jq '.object.sha')"
            fi
            if [ "$existing" != "$sha" ]; then
              echo "Tag ${tag} already points at ${existing}, not ${sha}."
              if [ "$EVENT_NAME" = "push" ]; then
                echo "Delete that tag and push it again at a commit on main, or push a new version tag."
              else
                echo "Enter a new version when starting Build Release."
              fi
              exit 1
            fi
            echo "Tag ${tag} already points at this commit; the draft release will be updated."
          else
            echo "Tag ${tag} will be created on ${sha} when the draft release is published."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    uses: ./.github/workflows/tests.yaml

  release:
    needs: [resolve, tests]
    runs-on: macos-26
    timeout-minutes: 120
    env:
      YAAGL_VERSION: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure channel secrets and Neutralino runtime
        run: ./configure.sh
        env:
          YAAGL_NEU_TAG: latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hosts helper from release
        run: bash scripts/update-hosts-helper-release.sh
        env:
          HELPER_RELEASE: latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned Sophon release
        run: ./build-sophon.sh

      - name: Download pinned Sophon release for x64
        run: SOPHON_ARCH=x64 ./build-sophon.sh

      - name: Build arm64 release assets
        run: bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: arm64

      - name: Build x64 release assets
        run: bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: x64

      - name: Build universal release assets
        run: bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: universal

      - name: Verify release assets
        run: |
          for arch in arm64 x64 universal; do
            test "$(find "release-assets/$arch" -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -eq 12
          done
          test "$(find release-assets/arm64 -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 12
          test "$(find release-assets/x64 -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 12
          test "$(find release-assets/universal -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 24

      - name: Read channel distribution name
        id: distribution
        run: |
          suffix=$(node -p 'require("./src/constants/yaaglm-config.secret.json").bh3GlobalSuffix')
          name="Yaaglm $suffix"
          printf 'bh3_name=%s\nbh3_archive=%s\n' "$name" "${name// /.}" >> "$GITHUB_OUTPUT"

      - name: Publish draft release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          name: Yaaglm ${{ needs.resolve.outputs.tag }} Release
          draft: true
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          preserve_order: true
          fail_on_unmatched_files: true
          body: |
            # Yaaglm ${{ needs.resolve.outputs.tag }}

            ## 主要更新 / Major Changes

            请参阅本次版本的提交记录。\
            See the commits included in this release.

            ## 下载 / Download

            打开 DMG，把应用拖到 `Applications`。也可以解压 `.tar.gz` 后手动复制应用。\
            Open the DMG and drag the app to `Applications`. You can also extract the `.tar.gz` and copy the app manually.

            ### 国际版多版本 / International Multi-Game

            | Channel | .app 文件名 / App Name | DMG | .tar.gz |
            | --- | --- | --- | --- |
            | `mhyos` | `Yaaglm OS.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.OS-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.OS-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.OS-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.OS.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.OS.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.OS.app.tar.gz) |

            ### 国服多版本 / CN Multi-Game

            | Channel | .app 文件名 / App Name | DMG | .tar.gz |
            | --- | --- | --- | --- |
            | `mhycn` | `Yaaglm CN.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.CN-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.CN-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.CN-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.CN.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.CN.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.CN.app.tar.gz) |

            ### 全版本 / All Game-Clients

            | Channel | .app 文件名 / App Name | DMG | .tar.gz |
            | --- | --- | --- | --- |
            | `all` | `Yaagl.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaagl-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaagl-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaagl-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaagl.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaagl.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaagl.app.tar.gz) |

            ### 国际版单版本 / International Single-Game

            | Channel | .app 文件名 / App Name | DMG | .tar.gz |
            | --- | --- | --- | --- |
            | `hk4eos` | `Yaaglm GI OS.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.OS-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.OS-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.OS-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.OS.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.OS.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.OS.app.tar.gz) |
            | `hkrpgos` | `Yaaglm HSR OS.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.OS-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.OS-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.OS-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.OS.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.OS.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.OS.app.tar.gz) |
            | `napos` | `Yaaglm ZZZ OS.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.OS-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.OS-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.OS-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.OS.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.OS.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.OS.app.tar.gz) |
            | `bh3glb` | `${{ steps.distribution.outputs.bh3_name }}.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ steps.distribution.outputs.bh3_archive }}-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ steps.distribution.outputs.bh3_archive }}-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ steps.distribution.outputs.bh3_archive }}-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ steps.distribution.outputs.bh3_archive }}.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ steps.distribution.outputs.bh3_archive }}.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ steps.distribution.outputs.bh3_archive }}.app.tar.gz) |
            | `cbjq` | `Yaaglm SCZ OS.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.OS-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.OS-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.OS-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.OS.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.OS.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.OS.app.tar.gz) |

            ### 国服单版本 / CN Single-Game

            | Channel | .app 文件名 / App Name | DMG | .tar.gz |
            | --- | --- | --- | --- |
            | `hk4ecn` | `Yaaglm GI CN.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.CN-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.CN-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.CN-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.CN.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.CN.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.GI.CN.app.tar.gz) |
            | `hkrpgcn` | `Yaaglm HSR.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.HSR.app.tar.gz) |
            | `napcn` | `Yaaglm ZZZ.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.ZZZ.app.tar.gz) |
            | `cbjqcn` | `Yaaglm SCZ.app` | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ-arm64.dmg) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ-x64.dmg) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ-universal.dmg) | [arm64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.app-arm64.tar.gz) · [x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.app-x64.tar.gz) · [universal](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/Yaaglm.SCZ.app.tar.gz) |

            ## 说明 / Notes

            - Apple Silicon Mac 推荐 `arm64`，Intel Mac 推荐 `x64`，不确定时可使用 `universal`。\
              `arm64` is recommended for Apple Silicon Macs; `x64` for Intel Macs; use `universal` if you are unsure.
            - 多版本入口优先推荐。\
              The multi-game entry is recommended.
          files: |
            release-assets/arm64/*.dmg
            release-assets/x64/*.dmg
            release-assets/universal/*.dmg
            release-assets/arm64/*.tar.gz
            release-assets/x64/*.tar.gz
            release-assets/universal/*.tar.gz

      - name: Preserve release assets after an upload failure
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: yaaglm-${{ needs.resolve.outputs.tag }}-release-assets
          path: release-assets/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
