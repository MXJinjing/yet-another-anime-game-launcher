name: Build Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      YAAGL_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure channel secrets and Neutralino runtime
        run: ./configure.sh

      - name: Build Sophon for arm64
        run: ./build-sophon.sh

      - name: Build Sophon for x64
        run: SOPHON_ARCH=x64 ./build-sophon.sh

      - name: Build arm64 release assets
        run: bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: arm64

      - name: Build x64 release assets
        run: bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: x64

      - name: Build universal release assets
        run: bash scripts/build-release.sh
        env:
          YAAGL_BUILD_ARCH: universal

      - name: Verify release assets
        run: |
          test "$(find release-assets/arm64 -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 11
          test "$(find release-assets/x64 -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 11
          test "$(find release-assets/universal -maxdepth 1 -name 'resources_*.neu' | wc -l | tr -d ' ')" -eq 11
          test "$(find release-assets/universal -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 22

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/arm64/*.tar.gz
            release-assets/x64/*.tar.gz
            release-assets/universal/*.tar.gz
            release-assets/universal/*.neu
